<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eaglercraft 26.3 Cobblemon Launcher</title>
    <style>
        body { margin: 0; background-color: #111; color: #fff; font-family: -apple-system, sans-serif; text-align: center; padding-top: 15%; }
        button { padding: 20px 40px; font-size: 20px; cursor: pointer; background: #ff5555; border: none; font-weight: bold; border-radius: 12px; color: white; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        input { padding: 12px; font-size: 16px; border-radius: 8px; border: 1px solid #444; background: #222; color: #fff; width: 300px; margin-bottom: 20px; text-align: center; }
    </style>
</head>
<body>
    <h1>Eaglercraft 26.3 Cobblemon Client</h1>
    <p>Enter your Render Web Service URL below:</p>
    <input type="text" id="renderUrl" placeholder="://onrender.com"><br>
    <button onclick="launchGame()">Connect to Cobblemon Server</button>

    <script>
        function launchGame() {
            let url = document.getElementById('renderUrl').value.trim();
            if (!url) {
                alert("Please enter your Render URL first!");
                return;
            }
            // Clean up the URL format if the user types wss:// manually
            url = url.replace("wss://", "").replace("http://", "").replace("https://", "");
            
            // Redirect right into the Eaglercraft 26.3 browser runtime pointing to your Render server proxy
            window.location.href = `https://eaglercraft.com{url}`;
        }
    </script>
</body>
</html>
